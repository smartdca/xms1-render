name: render
# xms1 4K tree video: one 180 s segment per job (screens change with absolute time), results as artifacts seg_kkk
on:
  workflow_dispatch:
    inputs:
      segs: { description: "segment range a-b, inclusive (0-79 = 4 h)", required: true, default: "0-79" }
      frames: { description: "frames per segment (empty = full 5400)", required: false, default: "" }
      peek: { description: "push stills of each segment to branch peek-<k> (yes/no)", required: false, default: "no" }
      crf: { description: "x264 CRF", required: false, default: "18" }
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { m: "${{ steps.m.outputs.m }}" }
    steps:
      - id: m
        run: |
          a=${SEGS%-*}; b=${SEGS#*-}
          echo "m=$(python3 -c "import json;print(json.dumps({'k':list(range($a,$b+1))}))")" >> $GITHUB_OUTPUT
        env: { SEGS: "${{ inputs.segs }}" }
  seg:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy: { fail-fast: false, max-parallel: 20, matrix: "${{ fromJSON(needs.plan.outputs.m) }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: setup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1-mesa-dri > /dev/null
          pip install -q numpy opencv-python-headless pillow moderngl
      - name: render
        env: { FRAMES: "${{ inputs.frames }}", CRF: "${{ inputs.crf }}", X264: medium }
        run: |
          export LP_NUM_THREADS=$(nproc); [ -z "$FRAMES" ] && unset FRAMES
          k=${{ matrix.k }}; t0=$(date +%s)
          python3 kit/render_seg.py abs work logos/a logos/b logos/c logos/h out $k $((k+1))
          f=out/$(printf 'seg_%03d.mp4' $k)
          n=$(ffprobe -v error -count_packets -select_streams v -show_entries stream=nb_read_packets -of csv=p=0 $f)
          echo "::notice::seg $k ok: $n frames, $(( $(stat -c%s $f) / 1000000 )) MB, $(( $(date +%s) - t0 )) s, $(nproc) cpu"
      - uses: actions/upload-artifact@v4
        with: { name: "seg_${{ matrix.k }}", path: "out/*.mp4", retention-days: 30, compression-level: 0 }
      - name: peek
        if: ${{ inputs.peek == 'yes' }}
        run: |
          k=${{ matrix.k }}; f=out/$(printf 'seg_%03d.mp4' $k); mkdir -p /tmp/p
          ffmpeg -v error -i $f -vf "select=eq(n\,0)" -vsync 0 /tmp/p/f0.png
          git config user.name render; git config user.email render@users.noreply.github.com
          git checkout --orphan peek-$k; git rm -rq --cached . ; cp /tmp/p/f0.png peek_f0.png
          git add peek_f0.png; git commit -qm "peek $k"; git push -f origin peek-$k
