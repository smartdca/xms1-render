name: patch
# xms1 遠方看板修正：每個 600 秒交界前 30 秒重算（23 小段，每段一個 job），結果是 artifact patch_<n>
on:
  workflow_dispatch:
    inputs:
      which: { description: "交界編號 a-b（1-23）", required: true, default: "1-23" }
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { m: "${{ steps.m.outputs.m }}" }
    steps:
      - id: m
        run: |
          a=${W%-*}; b=${W#*-}
          echo "m=$(python3 -c "import json;print(json.dumps({'n':list(range($a,$b+1))}))")" >> $GITHUB_OUTPUT
        env: { W: "${{ inputs.which }}" }
  patch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy: { fail-fast: false, max-parallel: 20, matrix: "${{ fromJSON(needs.plan.outputs.m) }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: setup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1-mesa-dri > /dev/null
          pip install -q numpy opencv-python-headless pillow moderngl
      - name: render
        env: { CRF: "18", X264: medium }
        run: |
          export LP_NUM_THREADS=$(nproc); t0=$(date +%s)
          python3 kit/render_seg.py patch work logos/a logos/b logos/c logos/h out ${{ matrix.n }}
          f=$(ls out/*.mp4)
          n=$(ffprobe -v error -count_packets -select_streams v -show_entries stream=nb_read_packets -of csv=p=0 $f)
          echo "::notice::patch ${{ matrix.n }} ok: $(basename $f) $n frames, $(( $(date +%s) - t0 )) s"
      - uses: actions/upload-artifact@v4
        with: { name: "patch_${{ matrix.n }}", path: "out/*.mp4", retention-days: 30, compression-level: 0 }
